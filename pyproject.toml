[project]
name = "codepilot-ai"
version = "0.3.0"
description = "Python code analysis, debugging and refactoring agents (FastAPI, Streamlit, LangGraph, Groq)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
codepilot-ai = "codepilot_ai:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The frontend is a set of plain modules run by `streamlit run`, not a package.
pythonpath = ["src", "frontend"]
markers = [
    "docker: needs a running Docker daemon and the sandbox image (skipped otherwise)",
]
